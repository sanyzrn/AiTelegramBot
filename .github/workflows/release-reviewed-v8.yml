name: Apply reviewed Saeed AI v8 bundle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-reviewed-v8.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install archive decoder
        run: python -m pip install --disable-pip-version-check brotli==1.1.0
      - name: Verify and extract exact reviewed upgrade bundle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,io,tarfile
          from pathlib import Path
          import brotli
          expected=['709ef36e81696bb3','c7bbdb5da84738a5','60a563627af4419d','282c73969c523a59','53ab15aae20c13bb','cc18bc5e0d31e659','188c027a85f1c1a9','e393b25256d3235e','1800b1c6a00fe498','3bc2ea07fa0cbe1e']
          parts=[]
          for i,digest in enumerate(expected):
              s=Path(f'.upgrade/v8-part{i:02d}.txt').read_text()
              assert len(s)==(2008 if i==9 else 4096),f'Bad length, part {i}'
              assert hashlib.sha256(s.encode()).hexdigest().startswith(digest),f'Corrupt part {i}'
              parts.append(s)
          packed=base64.b64decode(''.join(parts),validate=True)
          assert hashlib.sha256(packed).hexdigest()=='60bbb9738558da567d6e5a04aaa1718da8a1ff16613f538b6c40cd874270126b', 'Invalid archive signature'
          decoded=brotli.decompress(packed)
          allowed={'.gitignore','README.md','supabase/config.toml','.github/workflows/deploy-supabase.yml','.github/workflows/import-supabase.yml',
          'supabase/functions/saeed-ai-ui/index.ts','supabase/functions/saeed-ai-ui/deno.json',
          'supabase/functions/saeed-ai-v7/index.ts','supabase/functions/saeed-ai-v7/deno.json',
          'supabase/functions/saeed-ai-reminders/index.ts','supabase/functions/saeed-ai-reminders/deno.json',
          'supabase/migrations/20260919154210_saeed_ai_add_mystic_tone.sql',
          'supabase/migrations/20260920090000_saeed_ai_reminders_tasks.sql',
          'supabase/migrations/20260920205000_saeed_ai_v8_preference_states.sql',
          'supabase/migrations/20260920205100_saeed_ai_v8_vault_cron_auth.sql'}
          with tarfile.open(fileobj=io.BytesIO(decoded),mode='r:') as archive:
              members=archive.getmembers()
              assert {x.name for x in members}==allowed,'Unexpected files in archive'
              for member in members:
                  assert member.isfile(),'Not a regular file'
                  data=archive.extractfile(member).read()
                  path=Path(member.name)
                  path.parent.mkdir(parents=True,exist_ok=True)
                  path.write_bytes(data)
          print('Bundle SHA256 verified; safely extracted exactly',len(allowed),'expected files.')
          PY
          for source in supabase/functions/saeed-ai-v7/index.ts supabase/functions/saeed-ai-ui/index.ts supabase/functions/saeed-ai-reminders/index.ts; do
            node --experimental-strip-types --check "$source"
          done
          grep -Fq 'X-Saeed-Cron-Secret' supabase/functions/saeed-ai-reminders/index.ts
          grep -Fq 'saeed_ai_authenticate_reminder_cron' supabase/functions/saeed-ai-reminders/index.ts
          grep -Fq 'X-Telegram-Bot-Api-Secret-Token' supabase/functions/saeed-ai-v7/index.ts
          grep -Fq 'X-Telegram-Bot-Api-Secret-Token' supabase/functions/saeed-ai-ui/index.ts
      - name: Commit reviewed source only, without bundle or temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .gitignore README.md supabase/config.toml supabase/migrations supabase/functions/saeed-ai-v7 supabase/functions/saeed-ai-ui supabase/functions/saeed-ai-reminders .github/workflows/deploy-supabase.yml .github/workflows/import-supabase.yml
          git diff --cached --check
          git diff --cached --name-only
          if git diff --cached --quiet; then
            echo 'No source changes to commit.'
          else
            git commit -m 'feat: install reviewed Saeed AI v8.0.1 source and Vault cron migrations'
            git push origin HEAD:main
          fi
