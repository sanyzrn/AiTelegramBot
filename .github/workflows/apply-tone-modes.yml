name: Apply Saeed AI tone modes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-tone-modes.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch exact tone definitions and both AI prompts; verify invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          v7 = Path('supabase/functions/saeed-ai-v7/index.ts')
          ui = Path('supabase/functions/saeed-ai-ui/index.ts')
          a = v7.read_text(encoding='utf-8')
          b = ui.read_text(encoding='utf-8')
          def swap(text, old, new, label):
              count = text.count(old)
              assert count == 1, f'{label}: expected exactly one anchor, got {count}'
              return text.replace(old, new, 1)
          guide = "function toneGuide(tone){if(tone==='witty')return 'Be a consistently upbeat, genuinely kind, very playful Iranian-Persian friend. Use lively colloquial banter, clever original jokes and funny observations, warm affection, and natural emojis (usually 1-3, more when the user is playful). Say حاجی occasionally when it fits, not in every reply. Answer the actual request first; do not become a repetitive comedian, invent facts, or make fun of the user. For grief, illness, danger or distress be sincerely gentle instead of cracking jokes. Honor explicitly requested formal writing and preserve technical accuracy.';if(tone==='mystic')return 'Reply in original Persian prose inspired by seventh-century Hijri (thirteenth-century) Sufi literature: musical, luminous, tender, contemplative and subtly poetic, with elegant old-fashioned diction and original metaphors of the heart, light and the journey. Address the user as ای دوست when natural. Occasionally compose an ORIGINAL short verse if the request welcomes poetry; never quote or attribute invented lines to Rumi, Saadi or another poet. Answer the concrete question accurately and intelligibly; keep code, URLs, numbers and safety advice plain and precise. Be gentle with sensitive topics.';return 'Follow the selected tone naturally without sacrificing accuracy or the requested output format.';}\n"
          a = swap(a, "witty:'😄 شوخ‌طبع'}, SIZES", "witty:'😄 شوخ‌طبع',mystic:'🪷 عارفانه'}, SIZES", 'v7 tone dictionary')
          a = swap(a, "['🎨 خلاق','😄 شوخ‌طبع'],['⚙️ تنظیمات'", "['🎨 خلاق','😄 شوخ‌طبع'],['🪷 عارفانه'],['⚙️ تنظیمات'", 'v7 tone keyboard')
          a = swap(a, 'const MENU = ', guide + 'const MENU = ', 'v7 tone guide')
          a = swap(a, 'Tone ${p.tone}; length ${p.answer_length}.', 'Tone ${p.tone}. ${toneGuide(p.tone)} Length ${p.answer_length}.', 'v7 prompt, text voice and documents')
          a = a.replace("'7.6-voice-execute'", "'7.8-tone-modes'")
          b = swap(b, "'😄 شوخ‌طبع','⚡ کوتاه'", "'😄 شوخ‌طبع','🪷 عارفانه','⚡ کوتاه'", 'UI forwarding menu')
          b = swap(b, 'async function config(){', guide + 'async function config(){', 'UI tone guide')
          b = swap(b, 'Tone ${pref.tone}; length ${pref.answer_length}.', 'Tone ${pref.tone}. ${toneGuide(pref.tone)} Length ${pref.answer_length}.', 'UI prompt, chat and grounded search')
          b = b.replace("'7.7-search-fix'", "'7.8-tone-modes'")
          a = swap(a, "configured:ready(),reply_keyboard_only", "configured:ready(),tone_modes:true,reply_keyboard_only", 'v7 health signal')
          b = swap(b, "configured:ready(),reply_keyboard_gateway", "configured:ready(),tone_modes:true,reply_keyboard_gateway", 'UI health signal')
          assert "mystic:'🪷 عارفانه'" in a
          assert "['🪷 عارفانه']" in a
          assert "'🪷 عارفانه','⚡ کوتاه'" in b
          assert a.count('toneGuide(p.tone)') == 1
          assert b.count('toneGuide(pref.tone)') == 1
          assert 'X-Telegram-Bot-Api-Secret-Token' in a and 'X-Telegram-Bot-Api-Secret-Token' in b
          assert 'mystic' in guide and 'witty' in guide and 'For grief' in guide
          assert "'7.8-tone-modes'" in a and "'7.8-tone-modes'" in b
          v7.write_text(a, encoding='utf-8')
          ui.write_text(b, encoding='utf-8')
          print('PASS: tone menu, UI gateway, text + voice + web prompts, webhook authentication and version checks')
          PY
          git diff --check
          git diff --stat
      - name: Commit only the two function sources
        shell: bash
        run: |
          set -euo pipefail
          git add -- supabase/functions/saeed-ai-v7/index.ts supabase/functions/saeed-ai-ui/index.ts
          git diff --cached --quiet && { echo 'No tone changes'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: playful Persian and seventh-century mystic tone modes'
          git push origin HEAD:main
