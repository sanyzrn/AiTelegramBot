name: Diagnose legacy TypeScript
on:
  push:
    branches: [main]
    paths: ['.github/workflows/refactor-type-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Inventory top-level declarations and existing dependencies
        shell: bash
        run: |
          set -euo pipefail
          for f in saeed-ai-v7 saeed-ai-ui; do
            p="supabase/functions/$f/index.ts"
            echo "### $f: $(wc -l < "$p") lines, $(wc -c < "$p") bytes"
            grep -nE '^(async )?function [A-Za-z_]+|^(const|let|declare const) [A-Za-z_]+|^Deno\.serve' "$p" || true
          done
