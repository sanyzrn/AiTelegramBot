name: Install reviewed v8 source only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-v8-source-only.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check brotli==1.1.0
      - name: Verify exact bundle and extract allowed files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,io,tarfile
          from pathlib import Path
          import brotli
          chunks=[Path(f'.upgrade/v8-part{i:02d}.txt').read_text() for i in range(10)]
          assert all(len(chunk)==(2008 if i==9 else 4096) for i,chunk in enumerate(chunks))
          compressed=base64.b64decode(''.join(chunks),validate=True)
          assert hashlib.sha256(compressed).hexdigest()=='60bbb9738558da567d6e5a04aaa1718da8a1ff16613f538b6c40cd874270126b'
          allowed={'.gitignore','README.md','supabase/config.toml','.github/workflows/deploy-supabase.yml','.github/workflows/import-supabase.yml',
          'supabase/functions/saeed-ai-ui/index.ts','supabase/functions/saeed-ai-ui/deno.json',
          'supabase/functions/saeed-ai-v7/index.ts','supabase/functions/saeed-ai-v7/deno.json',
          'supabase/functions/saeed-ai-reminders/index.ts','supabase/functions/saeed-ai-reminders/deno.json',
          'supabase/migrations/20260919154210_saeed_ai_add_mystic_tone.sql',
          'supabase/migrations/20260920090000_saeed_ai_reminders_tasks.sql',
          'supabase/migrations/20260920205000_saeed_ai_v8_preference_states.sql',
          'supabase/migrations/20260920205100_saeed_ai_v8_vault_cron_auth.sql'}
          with tarfile.open(fileobj=io.BytesIO(brotli.decompress(compressed)),mode='r:') as t:
            members=t.getmembers()
            assert {m.name for m in members}==allowed
            for member in members:
              assert member.isfile()
              target=Path(member.name)
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_bytes(t.extractfile(member).read())
          print('Verified source archive and extracted',len(allowed),'allowlisted files')
          PY
          for f in supabase/functions/saeed-ai-v7/index.ts supabase/functions/saeed-ai-ui/index.ts supabase/functions/saeed-ai-reminders/index.ts; do
            node --experimental-strip-types --check "$f"
          done
      - name: Commit source but DO NOT modify workflow files with limited token
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .gitignore README.md supabase/config.toml supabase/migrations supabase/functions/saeed-ai-v7 supabase/functions/saeed-ai-ui supabase/functions/saeed-ai-reminders
          git diff --cached --check
          git diff --cached --name-only
          if ! git diff --cached --quiet; then
            git commit -m 'feat: reviewed Saeed AI v8 source and Vault cron migrations'
            git push origin HEAD:main
          fi
