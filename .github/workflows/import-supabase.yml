name: Import Saeed AI source (manual recovery only)

# This is a destructive recovery action. Never run on a push to main.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: saeed-ai-source-import
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: zurfsjfulddkjiicegxh
    steps:
      - name: Check out trusted main
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Ensure the Supabase token is configured
        shell: bash
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo '::error::Set SUPABASE_ACCESS_TOKEN in repository Actions secrets first.'
            exit 1
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Download the exact production function sources
        shell: bash
        run: |
          set -euo pipefail
          supabase functions download saeed-ai-ui --project-ref "$PROJECT_REF" --use-api
          supabase functions download saeed-ai-v7 --project-ref "$PROJECT_REF" --use-api
          for function in saeed-ai-ui saeed-ai-v7; do
            if [ ! -s "supabase/functions/$function/index.ts" ]; then
              echo "::error::Source for $function is missing or empty. No changes committed."
              exit 1
            fi
          done
          if grep -REq '(sb_secret_[A-Za-z0-9_-]{10,}|sbp_[A-Za-z0-9_-]{10,}|gh[pousr]_[A-Za-z0-9_]{20,}|AIza[A-Za-z0-9_-]{25,}|[0-9]{8,12}:[A-Za-z0-9_-]{30,})' supabase/functions/; then
            echo '::error::Potential hard-coded credential detected. Review source privately; no changes committed.'
            exit 1
          fi
          echo 'Both production functions downloaded; source passed basic non-empty and credential-pattern checks.'

      - name: Commit only the two function directories
        shell: bash
        run: |
          set -euo pipefail
          git add -- supabase/functions/saeed-ai-ui supabase/functions/saeed-ai-v7
          if git diff --cached --quiet; then
            echo 'Source is already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: import current Saeed AI Edge Function source'
          git push origin HEAD:main
