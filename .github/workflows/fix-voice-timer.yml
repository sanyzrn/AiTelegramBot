name: Fix Saeed AI Voice Timers
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-voice-timer.yml'
      - 'scripts/fix_voice_timer.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: saeed-ai-voice-timer-integration
  cancel-in-progress: false
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_DEPLOY_TOKEN }}
      PROJECT_REF: zurfsjfulddkjiicegxh
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run regression tests and strict-check timer classifier
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test tests/*.test.mjs
          deno check supabase/functions/_shared/timer.ts supabase/functions/_shared/tool-intent.ts
          python3 -m py_compile scripts/fix_voice_timer.py
          ! grep -Eq '^//\s*@ts-nocheck' supabase/functions/_shared/timer.ts
      - name: Apply guarded voice fix and prove it is idempotent
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fix_voice_timer.py
          git diff --check
          git diff -- supabase/functions/saeed-ai-v7/index.ts > /tmp/timer-first.diff
          test -s /tmp/timer-first.diff || { echo '::error::Voice integration is missing'; exit 1; }
          python3 scripts/fix_voice_timer.py
          git diff -- supabase/functions/saeed-ai-v7/index.ts > /tmp/timer-second.diff
          cmp /tmp/timer-first.diff /tmp/timer-second.diff
          grep -Fq 'async function scheduleRealTimer' supabase/functions/saeed-ai-v7/index.ts
          grep -Fq 'if (timer) await scheduleRealTimer(id, chat, timer, update);' supabase/functions/saeed-ai-v7/index.ts
          grep -Fq 'if (error) throw Error("TIMER_SAVE")' supabase/functions/saeed-ai-v7/index.ts
          grep -Fq 'Speech-to-text only. No assistant response' supabase/functions/saeed-ai-v7/index.ts
          echo 'PASS: voice speech transcription now leads to actual idempotent timer insertion'
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy processor and Telegram gateway
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo '::error::Missing Supabase deployment secret'; exit 1; }
          supabase functions deploy saeed-ai-v7 --project-ref "$PROJECT_REF" --use-api --no-verify-jwt
          supabase functions deploy saeed-ai-ui --project-ref "$PROJECT_REF" --use-api --no-verify-jwt
          for fn in saeed-ai-v7 saeed-ai-ui; do
            curl --fail --silent --show-error --retry 3 --retry-delay 2 \
              "https://${PROJECT_REF}.supabase.co/functions/v1/${fn}?health=$(date +%s)" \
              | jq -e '.configured == true' >/dev/null
          done
          echo 'PASS: both real Telegram production endpoints respond'
      - name: Commit tested production fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/saeed-ai-v7/index.ts
          git commit -m 'fix: make voice_execute actually schedule timers instead of pretending'
          git push origin HEAD:main
