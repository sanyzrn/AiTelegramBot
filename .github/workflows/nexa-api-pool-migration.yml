name: One-time Nexa API pool migration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/nexa-api-pool-migration.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PROJECT_REF: zurfsjfulddkjiicegxh
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_DEPLOY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # Immutable audited commit containing the SQL verified by the migration CI.
          ref: 56068bc3d6c4d25ffa48659d55c048a7e7f7a071
      - name: Apply API pool SQL only to the expected production schema
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo "::error::Missing deploy token"; exit 1; }
          api="https://api.supabase.com/v1/projects/${PROJECT_REF}/database/query"
          q='select public.saeed_ai_schema_version() as v'
          status="$(curl -sS -o before.json -w '%{http_code}' -X POST "$api" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg query "$q" '{query:$query}')" )"
          { [ "$status" = 200 ] || [ "$status" = 201 ]; } || { echo "::error::Could not read schema (HTTP $status)"; exit 1; }
          live="$(jq -r '.[0].v // ""' before.json)"
          if [ "$live" = '20261024180000' ]; then
            echo 'Schema already applied'; exit 0
          fi
          test "$live" = '20261005130000' || {
            echo "::error::Unexpected schema version; migration refused"; exit 1;
          }
          sql='supabase/migrations/20261024180000_nexa_admin_api_pool.sql'
          test -s "$sql" || exit 1
          status="$(curl -sS -o applied.json -w '%{http_code}' -X POST "$api" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data-binary "$(jq -Rs '{query:.}' < "$sql")" )"
          if [ "$status" != 200 ] && [ "$status" != 201 ]; then
            echo "::error::Migration failed (HTTP $status)"
            jq -r '.[0].message // .message // .error // "SQL error"' applied.json 2>/dev/null | head -c 500 || true
            exit 1
          fi
          status="$(curl -sS -o after.json -w '%{http_code}' -X POST "$api" \
            -H "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg query "$q" '{query:$query}')" )"
          { [ "$status" = 200 ] || [ "$status" = 201 ]; }
          test "$(jq -r '.[0].v // ""' after.json)" = '20261024180000' || {
            echo "::error::Schema version verification failed"; exit 1;
          }
          echo 'PASS: Nexa multi-key Vault schema applied and verified'
