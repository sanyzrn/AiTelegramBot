name: One-time v9 source cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-v9-release-cleanup.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: one-time-v9-source-cleanup
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Apply one-time guarded TypeScript changes and verify idempotence
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/one_time_v9_release_cleanup.py
          python3 scripts/one_time_v9_release_cleanup.py
          git diff --check
          git diff -- supabase/functions > /tmp/cleanup-once.diff
          test -s /tmp/cleanup-once.diff
          python3 scripts/one_time_v9_release_cleanup.py
          git diff -- supabase/functions > /tmp/cleanup-twice.diff
          cmp /tmp/cleanup-once.diff /tmp/cleanup-twice.diff
      - name: Regression, callback integration and shared TypeScript checks
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test tests/*.test.mjs
          deno check supabase/functions/_shared/*.ts
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/saeed-ai-v7/index.ts').read_text()
          g=Path('supabase/functions/saeed-ai-ui/index.ts').read_text()
          l=Path('supabase/functions/_shared/life.ts').read_text()
          r=Path('supabase/functions/saeed-ai-reminders/index.ts').read_text()
          assert all('version: "9.0.0"' in s for s in (p,g,r))
          assert 'if (await handleLifeCallback({ db, tg, send }, id, chat, a, c.message.message_id)) return;' in p
          assert 'answerCallbackQuery' in g and 'CALLBACK_ACK' in g
          assert 'editMessageText' in l and 'SHOP_REFRESH' in l
          assert 'inline_task_shopping_actions: true' in p
          assert 'async function listTasks(id, chat) {\n  return handleLifeMessage({ db, tg, send }, id, chat, "/tasks", 0);\n}' in p
          print('PASS: v9 release, no dead task branch, fast callback ACK and interactive shopping UI')
          PY
      - name: Commit real TypeScript sources directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/saeed-ai-v7/index.ts supabase/functions/saeed-ai-ui/index.ts supabase/functions/saeed-ai-reminders/index.ts supabase/functions/_shared/life.ts
          git commit -m 'fix(v9): release metadata, fast callback ACK and refreshed shopping list'
          git push origin HEAD:main
          echo 'The canonical deploy-supabase workflow publishes the committed sources, including shared modules.'
