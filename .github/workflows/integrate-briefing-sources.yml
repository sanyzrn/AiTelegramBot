name: Integrate Free Briefing Sources
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/integrate-briefing-sources.yml'
      - 'scripts/integrate_briefing_sources.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: saeed-ai-source-integration
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_DEPLOY_TOKEN }}
      PROJECT_REF: zurfsjfulddkjiicegxh
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test sourced data validation and regression suite
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test tests/*.test.mjs
          python3 -m py_compile scripts/integrate_briefing_sources.py
      - name: Apply guarded patch and verify exact idempotence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/integrate_briefing_sources.py
          git diff --check
          git diff -- supabase/functions > /tmp/briefing-first.diff
          test -s /tmp/briefing-first.diff || { echo '::error::Integration did not apply'; exit 1; }
          python3 scripts/integrate_briefing_sources.py
          git diff -- supabase/functions > /tmp/briefing-second.diff
          cmp /tmp/briefing-first.diff /tmp/briefing-second.diff
          grep -Fq 'v9_market_weather: true' supabase/functions/saeed-ai-reminders/index.ts
          grep -Fq 'پیش‌نمایش منابع صبح‌نامه' supabase/functions/_shared/life.ts
          grep -Fq 'const external = await briefingExternalSections();' supabase/functions/saeed-ai-reminders/index.ts
          echo 'PASS: idempotent wiring of external sources and manual preview'
      - name: Probe upstream APIs without inventing market freshness
        shell: bash
        run: |
          set -euo pipefail
          if curl -fsSL --max-time 12 'https://api.open-meteo.com/v1/forecast?latitude=35.6892&longitude=51.3890&current=temperature_2m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&forecast_days=1&timezone=Asia%2FTehran' | jq -e '.timezone == "Asia/Tehran" and (.daily.temperature_2m_max[0] | type == "number")' >/dev/null; then
            echo 'PASS: Open-Meteo live weather JSON responds'
          else
            echo '::warning::Weather provider unreachable; runtime will omit unverified weather'
          fi
          if curl -fsSL --max-time 12 'https://raw.githubusercontent.com/HosseinOdd/Navasan-API/main/data/fiat.json' | jq -e '.usd.value > 0 and .usd.date > 1700000000' >/dev/null && curl -fsSL --max-time 12 'https://raw.githubusercontent.com/HosseinOdd/Navasan-API/main/data/gold.json' | jq -e '."18ayar".value > 0 and ."18ayar".date > 1700000000' >/dev/null; then
            echo 'PASS: Free market JSON shape responds; per-quote freshness is validated at runtime'
          else
            echo '::warning::Market JSON unavailable; runtime will omit market quotes'
          fi
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy processor and gateway and scheduled dispatcher
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo '::error::Missing Supabase deploy secret'; exit 1; }
          supabase functions deploy saeed-ai-v7 --project-ref "$PROJECT_REF" --use-api --no-verify-jwt
          supabase functions deploy saeed-ai-reminders --project-ref "$PROJECT_REF" --use-api --no-verify-jwt
          supabase functions deploy saeed-ai-ui --project-ref "$PROJECT_REF" --use-api --no-verify-jwt
          for fn in saeed-ai-v7 saeed-ai-ui; do
            curl --fail --silent --show-error --retry 3 "https://${PROJECT_REF}.supabase.co/functions/v1/${fn}?health=$(date +%s)" | jq -e '.configured == true' >/dev/null
          done
          curl --fail --silent --show-error --retry 3 "https://${PROJECT_REF}.supabase.co/functions/v1/saeed-ai-reminders?health=$(date +%s)" | jq -e '.configured == true and .v9_market_weather == true' >/dev/null
          echo 'PASS: three live services deployed; briefing sources health visible'
      - name: Commit integrated code after verified deployment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/saeed-ai-v7/index.ts supabase/functions/saeed-ai-ui/index.ts supabase/functions/saeed-ai-reminders/index.ts supabase/functions/_shared/life.ts
          git commit -m 'feat: show verified free weather and market in briefing with manual preview'
          git push origin HEAD:main
