name: Fix Saeed AI stale search routing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-search-routing.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact, checked source patches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          ui = Path('supabase/functions/saeed-ai-ui/index.ts')
          v7 = Path('supabase/functions/saeed-ai-v7/index.ts')
          def patch(path, old, new):
              source = path.read_text()
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Unexpected source for {path}: expected 1 matching anchor, found {count}; no commit')
              path.write_text(source.replace(old, new))
          patch(v7,
              "if(/^\\/(start|menu|help)(?:@\\w+)?$/.test(text))return show(id,chat,'home');",
              "if(/^\\/(start|menu|help)(?:@\\w+)?$/.test(text)){await save(id,{pending_tool:'chat'});return show(id,chat,'home');}")
          patch(v7,
              "if(pages[text]){await show(id,chat,pages[text]);return true;}",
              "if(pages[text]){if(pages[text]==='home')await save(id,{pending_tool:'chat'});await show(id,chat,pages[text]);return true;}")
          patch(v7,
              "if(maps[a])return show(id,chat,maps[a]);",
              "if(maps[a]){if(maps[a]==='home')await save(id,{pending_tool:'chat'});return show(id,chat,maps[a]);}")
          patch(ui,
              "const pref=p||{tone:'friendly',answer_length:'balanced',language:'fa',pending_tool:'chat'},s=await config(),",
              "const pref=p||{tone:'friendly',answer_length:'balanced',language:'fa',pending_tool:'chat'};const dismissSearch=(/^(?:سلا+م|درود|صبح بخیر|شب بخیر|hello\\b|hi\\b)/iu.test(prompt)&&!/(?:جستجو|جست‌وجو|آنلاین|قیمت|خبر|امروز|latest|search|price|news)/iu.test(prompt))||/(?:جستجو|جست‌وجو)\\s*(?:نخواستم|نمی‌خواستم|نمیخواستم|نمی‌خوام|نمیخوام)|فقط\\s+سلام\\s+کردم/iu.test(prompt);if(pref.pending_tool==='web'&&dismissSearch){const{error:resetError}=await db.from('telegram_bot_preferences').update({pending_tool:'chat',updated_at:new Date().toISOString()}).eq('telegram_user_id',id);if(resetError)throw Error('WEB_RESET');pref.pending_tool='chat'}const s=await config(),")
          patch(ui,
              "await send(chatId,pref.pending_tool==='web'?searchMessage(reason):'🙈 الان یه مشکل کوچولو پیش اومد؛ دوباره امتحان کن. ❤️')",
              "if(pref.pending_tool==='web'){const{error:resetError}=await db.from('telegram_bot_preferences').update({pending_tool:'chat',updated_at:new Date().toISOString()}).eq('telegram_user_id',id);if(resetError)console.error('WEB_RESET',resetError.code)}await send(chatId,pref.pending_tool==='web'?searchMessage(reason):'🙈 الان یه مشکل کوچولو پیش اومد؛ دوباره امتحان کن. ❤️')")
          a = ui.read_text()
          b = v7.read_text()
          assert "if(pref.pending_tool==='web'&&dismissSearch)" in a
          assert "if(pref.pending_tool==='web'){const{error:resetError}" in a
          assert "if(pages[text]==='home')await save(id,{pending_tool:'chat'})" in b
          assert "if(maps[a]==='home')await save(id,{pending_tool:'chat'})" in b
          print('PASS: stale web mode resets on /start, Home, greeting/correction and search failures.')
          PY
          git diff --check
          git add -- supabase/functions/saeed-ai-ui/index.ts supabase/functions/saeed-ai-v7/index.ts
          git diff --cached --quiet && { echo 'No changes needed'; exit 0; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: prevent sticky web search after failures and greetings'
          git push origin HEAD:main
