name: Complete Saeed AI Modular Refactor
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/complete-modular-refactor.yml'
      - 'scripts/refactor_entrypoints.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: saeed-ai-modular-refactor
  cancel-in-progress: false
jobs:
  refactor:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install AST compiler and produce real source modules
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --ignore-scripts typescript@5.9.3
          node --check scripts/refactor_entrypoints.mjs
          node scripts/refactor_entrypoints.mjs
          git diff --check
          for fn in saeed-ai-v7 saeed-ai-ui; do
            if grep -rEn '@ts-nocheck|@ts-ignore|@ts-expect-error' "supabase/functions/$fn/index.ts" "supabase/functions/$fn/core"; then
              echo '::error::TypeScript suppression remains'; exit 1
            fi
            test "$(find "supabase/functions/$fn/core" -maxdepth 1 -name '*.ts' | wc -l)" -ge 5
          done
      - name: Check every TypeScript module and execute all regressions
        shell: bash
        run: |
          set -euo pipefail
          deno check --config supabase/functions/saeed-ai-v7/deno.json supabase/functions/saeed-ai-v7/index.ts supabase/functions/saeed-ai-v7/core/*.ts
          deno check --config supabase/functions/saeed-ai-ui/deno.json supabase/functions/saeed-ai-ui/index.ts supabase/functions/saeed-ai-ui/core/*.ts
          deno check supabase/functions/_shared/*.ts
          node --experimental-strip-types --test tests/*.test.mjs
          python3 - <<'PY'
          from pathlib import Path
          a=Path('supabase/functions/saeed-ai-v7/index.ts').read_text()
          b=Path('supabase/functions/saeed-ai-ui/index.ts').read_text()
          assert 'Deno.serve(' in a and 'Deno.serve(' in b
          for token in ('version: "9.0.0"','v9_recurring: true','v9_briefings: true','v9_callback_refresh: true','X-Telegram-Bot-Api-Secret-Token'):
            assert token in a, 'processor missing: '+token
          for token in ('version: "9.0.0"','v9_auto_tool_routing: true','v9_callback_fast_ack: true','X-Telegram-Bot-Api-Secret-Token'):
            assert token in b, 'gateway missing: '+token
          life=Path('supabase/functions/saeed-ai-v7/core/life.ts').read_text()
          assert 'async function saveTasks' in life and '.delete()' not in life.split('async function saveTasks',1)[1].split('async function listTasks',1)[0]
          assert 'handleLifeCallback' in a and 'calculateExact' in a
          print('PASS: retained v9 service contract, webhook verification and non-destructive tasks')
          PY
      - name: Commit checked modular sources
        shell: bash
        run: |
          set -euo pipefail
          git add supabase/functions/saeed-ai-v7 supabase/functions/saeed-ai-ui
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: split both bot entrypoints and remove TypeScript suppressions'
          git push origin HEAD:main
