name: Inspect v9.1.0 uploaded archive (review branch only)
on:
  push:
    branches: ['release/v9.1.0-reviewed-20260921']
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == 'refs/heads/release/v9.1.0-reviewed-20260921'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect archive without extracting or executing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,lzma,tarfile,io
          p=Path('scripts/v91_payload.b64').read_text().strip()
          print('Encoded length',len(p))
          raw=base64.b64decode(p,validate=True)
          print('Decoded length',len(raw),'sha256',hashlib.sha256(raw).hexdigest())
          data=lzma.decompress(raw)
          print('Tar length',len(data))
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:') as tar:
            for m in tar.getmembers(): print('Archive entry:',m.name,m.size)
          PY
