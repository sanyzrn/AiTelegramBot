name: Inspect v9.1.0 archive completeness
on:
  push:
    branches: ['release/v9.1.0-reviewed-20260921']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe partial archive without extraction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,lzma
          p=Path('scripts/v91_payload.b64').read_text().strip()
          raw=base64.b64decode(p+'='*((-len(p))%4),validate=True)
          decoder=lzma.LZMADecompressor()
          try:
            data=decoder.decompress(raw)
            print('encoded',len(p),'decoded',len(raw),'uncompressed',len(data),'eof',decoder.eof,'sha256',hashlib.sha256(raw).hexdigest())
          except lzma.LZMAError as e:
            print('ERROR: payload corrupt',repr(e))
            raise
          PY
