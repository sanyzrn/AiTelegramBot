name: One-time v9.1.0 source-only verified import
on:
  push:
    branches: ['release/v9.1.0-reviewed-20260921']
    paths: ['scripts/v91_retry.trigger']
permissions:
  contents: write
jobs:
  verified-import:
    if: github.ref == 'refs/heads/release/v9.1.0-reviewed-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify main baseline, validate signed payload hashes, restore exact 17 files
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/release/v9.1.0-reviewed-20260921'
          baseline='6fd63d9bf60ecf21e0ca5155bd7c5864bd399269'
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$baseline" || { echo 'Main moved: stop and reconcile'; exit 1; }
          git merge-base --is-ancestor "$baseline" HEAD
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,lzma,struct
          encoded=''.join(Path(f'scripts/v91_final.part{i}').read_text('ascii') for i in range(4))
          compressed=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(compressed).hexdigest()=='57be7545a208700ae048178010c84cdfcaaf8826ae20c077183134ae18f03294','Compressed bundle mismatch'
          data=lzma.decompress(compressed)
          assert hashlib.sha256(data).hexdigest()=='567dc84b6ed1a34e25adcb8c90cc18706fdcf568242040258140ff0374af1f1d','Source bundle mismatch'
          allowed={'.env.example','.github/workflows/deploy-supabase.yml','.github/workflows/import-supabase.yml','.github/workflows/shared-typecheck.yml','README.md','supabase/config.toml','supabase/functions/_shared/version.ts','supabase/functions/saeed-ai-reminders/index.ts','supabase/functions/saeed-ai-ui/core/config.ts','supabase/functions/saeed-ai-ui/index.ts','supabase/functions/saeed-ai-v7/V9_RELEASE_NOTES.md','supabase/functions/saeed-ai-v7/core/admin.ts','supabase/functions/saeed-ai-v7/core/life.ts','supabase/functions/saeed-ai-v7/core/work.ts','supabase/functions/saeed-ai-v7/index.ts','supabase/migrations/20260921040749_saeed_ai_v91_keyboard_page_states.sql','tests/gateway-routing.test.mjs'}
          offset=0; recovered={}
          while offset<len(data):
            assert offset+2<=len(data)
            size=struct.unpack_from('>H',data,offset)[0];offset+=2
            assert 0<size<200 and offset+size+4<=len(data)
            path=data[offset:offset+size].decode('utf-8');offset+=size
            length=struct.unpack_from('>I',data,offset)[0];offset+=4
            assert 0<length<25000 and offset+length<=len(data) and path in allowed and path not in recovered
            recovered[path]=data[offset:offset+length];offset+=length
          assert len(recovered)==17 and set(recovered)==allowed
          for name,content in recovered.items():
            target=Path(name)
            assert not target.is_symlink()
            target.parent.mkdir(parents=True,exist_ok=True)
            target.write_bytes(content)
          print('PASS: restored 17 exact vetted source files with pinned bundle checksums')
          PY
      - name: Typecheck all modules and execute every regression
        shell: bash
        run: |
          set -euo pipefail
          deno check --config supabase/functions/saeed-ai-v7/deno.json supabase/functions/saeed-ai-v7/index.ts supabase/functions/saeed-ai-v7/core/*.ts
          deno check --config supabase/functions/saeed-ai-ui/deno.json supabase/functions/saeed-ai-ui/index.ts supabase/functions/saeed-ai-ui/core/*.ts
          deno check supabase/functions/_shared/*.ts
          deno check --config supabase/functions/saeed-ai-reminders/deno.json supabase/functions/saeed-ai-reminders/index.ts
          node --experimental-strip-types --test tests/*.test.mjs
          grep -Fq '20260921040749_saeed_ai_v91_keyboard_page_states.sql' .github/workflows/deploy-supabase.yml
      - name: Commit ONLY reviewed source files, not workflow files, on release branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/release/v9.1.0-reviewed-20260921'
          git add -- .env.example README.md supabase/config.toml supabase/functions/_shared/version.ts supabase/functions/saeed-ai-reminders/index.ts supabase/functions/saeed-ai-ui/core/config.ts supabase/functions/saeed-ai-ui/index.ts supabase/functions/saeed-ai-v7/V9_RELEASE_NOTES.md supabase/functions/saeed-ai-v7/core/admin.ts supabase/functions/saeed-ai-v7/core/life.ts supabase/functions/saeed-ai-v7/core/work.ts supabase/functions/saeed-ai-v7/index.ts supabase/migrations/20260921040749_saeed_ai_v91_keyboard_page_states.sql tests/gateway-routing.test.mjs
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 14
          test -z "$(git diff --cached --name-only | grep '^\.github/workflows/' || true)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: import tested Saeed AI v9.1.0 code and migration'
          git push origin HEAD:refs/heads/release/v9.1.0-reviewed-20260921
