name: Apply Saeed AI Auto Tools Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/enable-auto-tools.yml'
      - 'scripts/enable_auto_tool_routing.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: saeed-auto-tools-fix
  cancel-in-progress: false

jobs:
  apply-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_DEPLOY_TOKEN }}
      PROJECT_REF: zurfsjfulddkjiicegxh
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Apply source patch and verify repeatability
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/enable_auto_tool_routing.py
          python3 scripts/enable_auto_tool_routing.py
          cp supabase/functions/saeed-ai-v7/index.ts /tmp/saeed-bot-after-first.ts
          cp supabase/functions/saeed-ai-ui/index.ts /tmp/saeed-ui-after-first.ts
          python3 scripts/enable_auto_tool_routing.py
          cmp /tmp/saeed-bot-after-first.ts supabase/functions/saeed-ai-v7/index.ts
          cmp /tmp/saeed-ui-after-first.ts supabase/functions/saeed-ai-ui/index.ts
          git diff --check
          grep -Fq 'saeed_auto_tool' supabase/functions/saeed-ai-ui/index.ts
          grep -Fq 'setReminder(id, chat, requestText)' supabase/functions/saeed-ai-v7/index.ts
          grep -Fq 'forcedTool === "web"' supabase/functions/saeed-ai-ui/index.ts
          echo 'PASS: routing, idempotency, grounded search, reminder provider fallback'
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Verify deployment token
        shell: bash
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then echo '::error::Missing SUPABASE_DEPLOY_TOKEN'; exit 1; fi
      - name: Deploy updated processing function
        shell: bash
        run: supabase functions deploy saeed-ai-v7 --project-ref "$PROJECT_REF" --use-api --no-verify-jwt
      - name: Deploy updated gateway
        shell: bash
        run: supabase functions deploy saeed-ai-ui --project-ref "$PROJECT_REF" --use-api --no-verify-jwt
      - name: Verify live endpoints
        shell: bash
        run: |
          set -euo pipefail
          for fn in saeed-ai-v7 saeed-ai-ui; do
            curl --fail --silent --show-error --retry 3 --retry-delay 2 "https://${PROJECT_REF}.supabase.co/functions/v1/${fn}?health=$(date +%s)" | jq -e '.configured == true and .reminders == true and .version == "8.0.1"' > /dev/null
            echo "$fn production health passed"
          done
      - name: Commit tested source to GitHub
        shell: bash
        run: |
          set -euo pipefail
          git add supabase/functions/saeed-ai-v7/index.ts supabase/functions/saeed-ai-ui/index.ts
          if git diff --cached --quiet; then echo 'Already applied'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: automatically route conversational requests to tools'
          git push origin HEAD:main
