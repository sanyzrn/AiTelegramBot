name: Temporary branch-only dependency refactor
on:
  push:
    branches: ['refactor/dependency-cleanup-20260921']
    paths: ['.github/workflows/dependency-refactor-once.yml']
permissions:
  contents: write
jobs:
  refactor:
    if: github.ref == 'refs/heads/refactor/dependency-cleanup-20260921'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run previous audited refactor and normalize extracted file
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/refactor/dependency-cleanup-20260921'
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,textwrap
          original=subprocess.check_output(['git','show','58e979ec62be96a0a06f3b809e186f07402f862e:.github/workflows/dependency-refactor-once.yml'],text=True)
          fragments=original.split("          python3 - <<'PY'\n")
          assert len(fragments)==3, 'Original audited steps changed'
          transform=textwrap.dedent(fragments[1].split('\n          PY',1)[0])
          exec(compile(transform,'audited-branch-transform','exec'),{'__name__':'__main__'})
          menu=Path('supabase/functions/saeed-ai-v7/core/menu.ts')
          menu.write_text(menu.read_text(encoding='utf-8').rstrip()+'\n',encoding='utf-8')
          PY
      - name: Verify all functions, regressions and acyclic dependency graph
        shell: bash
        run: |
          set -euo pipefail
          deno check --config supabase/functions/saeed-ai-v7/deno.json supabase/functions/saeed-ai-v7/index.ts supabase/functions/saeed-ai-v7/core/*.ts
          deno check --config supabase/functions/saeed-ai-ui/deno.json supabase/functions/saeed-ai-ui/index.ts supabase/functions/saeed-ai-ui/core/*.ts
          deno check supabase/functions/_shared/*.ts
          deno check --config supabase/functions/saeed-ai-reminders/deno.json supabase/functions/saeed-ai-reminders/index.ts
          node --experimental-strip-types --test tests/*.test.mjs
          python3 - <<'PY'
          import subprocess,textwrap
          original=subprocess.check_output(['git','show','58e979ec62be96a0a06f3b809e186f07402f862e:.github/workflows/dependency-refactor-once.yml'],text=True)
          fragments=original.split("          python3 - <<'PY'\n")
          assert len(fragments)==3
          graph=textwrap.dedent(fragments[2].split('\n          PY',1)[0])
          exec(compile(graph,'audited-dependency-check','exec'),{'__name__':'__main__'})
          PY
      - name: Commit only to isolated refactor branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/refactor/dependency-cleanup-20260921'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/saeed-ai-v7/ supabase/functions/saeed-ai-ui/
          git diff --cached --check
          git diff --cached --quiet && { echo 'Nothing to commit'; exit 1; }
          git commit -m 'refactor: extract pure menu and prune legacy imports in both functions'
          git push origin HEAD:refs/heads/refactor/dependency-cleanup-20260921
