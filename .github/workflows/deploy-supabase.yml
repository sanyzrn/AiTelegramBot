name: Deploy Saeed AI to Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/saeed-ai-ui/**'
      - 'supabase/functions/saeed-ai-v7/**'
      - 'supabase/config.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saeed-ai-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_DEPLOY_TOKEN }}
      PROJECT_REF: zurfsjfulddkjiicegxh
    steps:
      - name: Check out main without persisting credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate exact production targets and webhook authentication
        shell: bash
        run: |
          set -euo pipefail
          for fn in saeed-ai-v7 saeed-ai-ui; do
            test -s "supabase/functions/$fn/index.ts" || { echo "::error::Missing $fn source"; exit 1; }
            test -s "supabase/functions/$fn/deno.json" || { echo "::error::Missing $fn Deno config"; exit 1; }
            grep -Fq 'X-Telegram-Bot-Api-Secret-Token' "supabase/functions/$fn/index.ts" || { echo "::error::Missing $fn Telegram webhook secret check"; exit 1; }
          done
          grep -Fq '[functions.saeed-ai-v7]' supabase/config.toml
          grep -Fq '[functions.saeed-ai-ui]' supabase/config.toml
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo '::error::Create SUPABASE_DEPLOY_TOKEN with Edge Functions Read-write scoped only to Saeed AI. Do not reuse the read-only import token.'
            exit 1
          fi

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy processing function first (keep Telegram webhook settings)
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy saeed-ai-v7 --project-ref "$PROJECT_REF" --use-api --no-verify-jwt

      - name: Deploy Telegram webhook gateway last
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy saeed-ai-ui --project-ref "$PROJECT_REF" --use-api --no-verify-jwt

      - name: Verify both live functions are configured
        shell: bash
        run: |
          set -euo pipefail
          for fn in saeed-ai-v7 saeed-ai-ui; do
            curl --fail --silent --show-error --retry 3 --retry-delay 2 \
              "https://${PROJECT_REF}.supabase.co/functions/v1/${fn}?health=$(date +%s)" \
              | jq -e '.configured == true' > /dev/null \
              || { echo "::error::Production health failed for $fn"; exit 1; }
            echo "$fn production health passed"
          done
