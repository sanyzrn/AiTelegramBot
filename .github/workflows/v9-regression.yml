name: Saeed AI Regression Tests
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'supabase/functions/_shared/**'
      - 'supabase/functions/saeed-ai-v7/**'
      - 'supabase/functions/saeed-ai-ui/**'
      - 'supabase/functions/saeed-ai-reminders/**'
      - 'tests/**'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'supabase/functions/_shared/**'
      - 'supabase/functions/saeed-ai-v7/**'
      - 'supabase/functions/saeed-ai-ui/**'
      - 'supabase/functions/saeed-ai-reminders/**'
      - 'tests/**'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Execute pure calculation, recurrence, ownership and intent tests
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: Protect tasks, deletion confirmation and extracted module boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          index=Path('supabase/functions/saeed-ai-v7/index.ts').read_text()
          core=Path('supabase/functions/saeed-ai-v7/core')
          life=(core/'life.ts').read_text()
          shared=Path('supabase/functions/_shared/life.ts').read_text()
          view=Path('supabase/functions/_shared/life-context.ts').read_text()
          ui=(core/'ui.ts').read_text()
          part=life.split('async function saveTasks',1)[1].split('async function listTasks',1)[0]
          assert '.delete()' not in part, 'saveTasks must append rather than delete'
          assert 'renderTasks({ db, tg, send }, id, chat)' in part, 'new task confirmation must have inline controls'
          assert 'برای تیک زدن بنویس' not in life, 'do not instruct numeric completion instead of inline buttons'
          assert 'telegram_update_id: update' in life, 'reminders must deduplicate updates'
          assert 'handleLifeCallback' in index and 'calculateExact' in index
          assert 'task:${x.done ? "undo" : "done"}:' in shared and 'showView(' in shared and 'editMessageText' in view, 'task callbacks must refresh original list'
          prompt=ui.split('if (text === "🗑 پاک‌کردن تسک‌ها")',1)[1].split('if (text === "✅ تأیید حذف همه تسک‌ها")',1)[0]
          confirm=ui.split('if (text === "✅ تأیید حذف همه تسک‌ها")',1)[1].split('if (text === "📋 پروفایل من")',1)[0]
          assert '.delete()' not in prompt and 'tasks_delete_confirm' in prompt
          assert 'p.keyboard_page !== "tasks_delete_confirm"' in confirm and '.delete()' in confirm
          assert '✅ تأیید حذف همه تسک‌ها' in ui and '❌ انصراف' in ui
          for name in ('state.ts','ui.ts','life.ts','model.ts'):
            assert 'unzipSync' not in (core/name).read_text(), f'Unrelated archive dependency in {name}'
          print('PASS: owner-scoped inline tasks, explicit bulk-delete confirmation and clean touched-module imports')
          PY
      - name: Never allow automatic writes to main from legacy patch workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          workflows=Path('.github/workflows')
          expected={'deploy-supabase.yml','import-supabase.yml','migrations-check.yml','shared-typecheck.yml','v9-regression.yml'}
          actual={p.name for p in workflows.glob('*.yml')}
          assert actual == expected, f'Review new or missing workflow: {sorted(actual ^ expected)}'
          assert not list(Path('scripts').glob('*.py')), 'One-shot source patch scripts must stay retired'
          for path in workflows.glob('*.yml'):
            source=path.read_text()
            if path.name == 'import-supabase.yml':
              assert 'workflow_dispatch:' in source and not re.search(r'(?m)^\s*push:\s*$', source), 'Recovery import must be manual-only'
              continue
            assert not re.search(r'(?m)^\s*contents:\s*write\s*$', source), f'Unexpected source write access: {path}'
          print('PASS: automatic workflows cannot patch or write to main')
          PY
