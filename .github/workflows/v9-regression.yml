name: Saeed AI v9 Regression Tests
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'supabase/functions/_shared/**'
      - 'supabase/functions/saeed-ai-v7/**'
      - 'supabase/functions/saeed-ai-ui/**'
      - 'supabase/functions/saeed-ai-reminders/**'
      - 'tests/**'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/**'
      - 'supabase/functions/_shared/**'
      - 'supabase/functions/saeed-ai-v7/**'
      - 'supabase/functions/saeed-ai-ui/**'
      - 'supabase/functions/saeed-ai-reminders/**'
      - 'tests/**'
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute pure calculation, recurrence, ownership and intent tests
        run: node --experimental-strip-types --test tests/*.test.mjs
      - name: Prevent task replacement and verify both monolithic and modular layouts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          index=Path('supabase/functions/saeed-ai-v7/index.ts').read_text()
          life=Path('supabase/functions/saeed-ai-v7/core/life.ts')
          source=life.read_text() if life.exists() else index
          part=source.split('async function saveTasks',1)[1].split('async function listTasks',1)[0]
          assert '.delete()' not in part, 'saveTasks must append rather than delete'
          assert 'telegram_update_id: update' in source, 'reminders must deduplicate updates'
          assert 'handleLifeCallback' in index, 'private callbacks must be wired'
          assert 'calculateExact' in index, 'exact calculator must be wired'
          print('PASS: non-destructive task creation and v9 integration guards')
          PY
      - name: Never allow automatic writes to main from legacy patch workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          workflows=Path('.github/workflows')
          expected={'deploy-supabase.yml','import-supabase.yml','shared-typecheck.yml','v9-regression.yml'}
          actual={p.name for p in workflows.glob('*.yml')}
          assert actual == expected, f'Review new or missing workflow: {sorted(actual ^ expected)}'
          assert not list(Path('scripts').glob('*.py')), 'One-shot source patch scripts must stay retired'
          for path in workflows.glob('*.yml'):
            source=path.read_text()
            if path.name == 'import-supabase.yml':
              assert 'workflow_dispatch:' in source and not re.search(r'(?m)^\s*push:\s*$', source), 'Recovery import must be manual-only'
              continue
            assert not re.search(r'(?m)^\s*contents:\s*write\s*$', source), f'Unexpected source write access: {path}'
          print('PASS: automatic workflows cannot patch or write to main')
          PY
