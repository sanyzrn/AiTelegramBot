name: Integrate Saeed AI v9 Life Core
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v9.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: saeed-v9-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run side-effect-free module tests
        run: node --experimental-strip-types --test tests/v9.test.mjs
      - name: Apply guarded integration twice and verify unchanged second run
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/v9_upgrade.py
          python3 scripts/v9_upgrade.py
          cp supabase/functions/saeed-ai-v7/index.ts /tmp/saeed-v9-once.ts
          python3 scripts/v9_upgrade.py
          cmp /tmp/saeed-v9-once.ts supabase/functions/saeed-ai-v7/index.ts
          git diff --check
          grep -Fq 'handleLifeCallback({ db, tg, send }' supabase/functions/saeed-ai-v7/index.ts
          grep -Fq 'repeat_rule: rule' supabase/functions/saeed-ai-v7/index.ts
          echo 'PASS: protected integration and repeatability'
      - name: Commit and deploy through existing production workflow
        shell: bash
        run: |
          set -euo pipefail
          git add supabase/functions/saeed-ai-v7/index.ts
          if git diff --cached --quiet; then echo 'Already integrated'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(v9): wire life utilities, append tasks and recurring reminders'
          git push origin HEAD:main
