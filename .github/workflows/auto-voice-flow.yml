name: Auto Voice Flow Fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auto-voice-flow.yml'
      - 'scripts/auto_voice_flow.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: saeed-ai-auto-voice-fix
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_DEPLOY_TOKEN }}
      PROJECT_REF: zurfsjfulddkjiicegxh
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check speech intent and full regression suite
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test tests/*.test.mjs
          deno check supabase/functions/_shared/voice-intent.ts
          python3 -m py_compile scripts/auto_voice_flow.py
      - name: Apply guarded patch and verify idempotence and safeguards
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/auto_voice_flow.py
          git diff --check
          git diff -- supabase/functions > /tmp/auto-voice-first.diff
          test -s /tmp/auto-voice-first.diff
          python3 scripts/auto_voice_flow.py
          git diff -- supabase/functions > /tmp/auto-voice-second.diff
          cmp /tmp/auto-voice-first.diff /tmp/auto-voice-second.diff
          python3 - <<'PY'
          from pathlib import Path
          p=Path('supabase/functions/saeed-ai-v7/index.ts').read_text()
          g=Path('supabase/functions/saeed-ai-ui/index.ts').read_text()
          voice=p.split('async function voiceAction(',1)[1].split('async function reserve(',1)[0]
          assert '.delete()' not in voice.split('  // Do not consume the stored file:',1)[1], 'voice must be retained for reply transformations'
          assert 'return chooseVoice(m, update)' in p
          assert 'await startWork(m, update, "execute", "", null)' in p
          assert 'if (await handleVoiceReply(m, update)) return;' in p
          assert 'eq("telegram_user_id", m.from.id)' in p and 'eq("telegram_message_id", replied.message_id)' in p
          assert 'if (m.reply_to_message?.voice || m.reply_to_message?.audio) return forward(update);' in g
          assert 'توی این ویس درخواست مشخصی پیدا نکردم.' in p
          assert 'Gemini handles voice even while OpenRouter' in p
          print('PASS: automatic execution, authenticated reply, no-command menu, voice retention')
          PY
          echo 'PASS: auto voice wiring and idempotence'
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy processing and gateway and verify live health
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo '::error::Missing deployment secret'; exit 1; }
          supabase functions deploy saeed-ai-v7 --project-ref "$PROJECT_REF" --use-api --no-verify-jwt
          supabase functions deploy saeed-ai-ui --project-ref "$PROJECT_REF" --use-api --no-verify-jwt
          for fn in saeed-ai-v7 saeed-ai-ui; do
            curl --fail --silent --show-error --retry 3 --retry-delay 2 \
              "https://${PROJECT_REF}.supabase.co/functions/v1/${fn}?health=$(date +%s)" \
              | jq -e '.configured == true and (.voice == true or .tone_modes == true)' >/dev/null
          done
          echo 'PASS: processor and gateway deployed with healthy configuration'
      - name: Commit production source after verification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/saeed-ai-v7/index.ts supabase/functions/saeed-ai-ui/index.ts
          git commit -m 'fix(voice): auto execute, reply transforms, and no-request menu'
          git push origin HEAD:main
