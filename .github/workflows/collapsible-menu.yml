name: Deploy Collapsible Telegram Menu
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/collapsible-menu.yml'
      - 'scripts/enable_collapsible_menu.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: saeed-ai-collapsible-menu
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_DEPLOY_TOKEN }}
      PROJECT_REF: zurfsjfulddkjiicegxh
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Run existing regression suite
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types --test tests/*.test.mjs
          python3 -m py_compile scripts/enable_collapsible_menu.py
      - name: Patch reply keyboard and verify native collapse settings
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/enable_collapsible_menu.py
          git diff --check
          git diff -- supabase/functions/saeed-ai-v7/index.ts > /tmp/menu-first.diff
          test -s /tmp/menu-first.diff
          python3 scripts/enable_collapsible_menu.py
          git diff -- supabase/functions/saeed-ai-v7/index.ts > /tmp/menu-second.diff
          cmp /tmp/menu-first.diff /tmp/menu-second.diff
          python3 - <<'PY'
          from pathlib import Path
          src = Path('supabase/functions/saeed-ai-v7/index.ts').read_text(encoding='utf-8')
          keyboard = src.split('const keyboard = (page, isAdmin) => ({', 1)[1].split('});', 1)[0]
          assert 'is_persistent: false' in keyboard
          assert 'one_time_keyboard: true' in keyboard
          assert 'resize_keyboard: true' in keyboard
          assert 'keyboard: rows(page, isAdmin)' in keyboard
          assert 'remove_keyboard' not in keyboard
          assert 'input_field_placeholder:' in keyboard
          print('PASS: native keyboard remains accessible from Telegram toggle but is no longer forced open')
          PY
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy bot processor and verify health
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SUPABASE_ACCESS_TOKEN:-}" || { echo '::error::Missing Supabase token'; exit 1; }
          supabase functions deploy saeed-ai-v7 --project-ref "$PROJECT_REF" --use-api --no-verify-jwt
          curl --fail --silent --show-error --retry 3 --retry-delay 2 \
            "https://${PROJECT_REF}.supabase.co/functions/v1/saeed-ai-v7?health=$(date +%s)" \
            | jq -e '.configured == true and .reply_keyboard_only == true' >/dev/null
          echo 'PASS: production bot processor healthy'
      - name: Commit tested production source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/saeed-ai-v7/index.ts
          git commit -m 'fix(ui): make Telegram reply keyboard collapsible and one-time'
          git push origin HEAD:main
